name: braille_assist
description: "A multi-disability assistive system UI, focusing on the Braille module."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  file_picker: ^6.1.1
  camera: ^0.12.0+1
  lottie: ^3.1.0
  flutter_staggered_animations: ^1.1.1
  provider: ^6.1.1
  image_picker: ^1.2.1
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
